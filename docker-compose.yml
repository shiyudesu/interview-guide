  APP_OPENTREK_GENERAL_AGENT_VERSION: ${APP_OPENTREK_GENERAL_AGENT_VERSION:-}
  APP_OPENTREK_INTERVIEWER_AGENT_CODE: ${APP_OPENTREK_INTERVIEWER_AGENT_CODE:-}
  APP_OPENTREK_INTERVIEWER_AGENT_VERSION: ${APP_OPENTREK_INTERVIEWER_AGENT_VERSION:-}
  APP_OPENTREK_EVALUATOR_AGENT_CODE: ${APP_OPENTREK_EVALUATOR_AGENT_CODE:-}
  APP_OPENTREK_EVALUATOR_AGENT_VERSION: ${APP_OPENTREK_EVALUATOR_AGENT_VERSION:-}
  APP_OPENTREK_RAG_AGENT_CODE: ${APP_OPENTREK_RAG_AGENT_CODE:-}
  APP_OPENTREK_RAG_AGENT_VERSION: ${APP_OPENTREK_RAG_AGENT_VERSION:-}
