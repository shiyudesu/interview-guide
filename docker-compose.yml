  APP_AUTH_LOGIN_ACCOUNT_LIMIT_PER_MINUTE: ${APP_AUTH_LOGIN_ACCOUNT_LIMIT_PER_MINUTE:-8}
  APP_AUTH_REGISTRATION_IP_LIMIT_PER_HOUR: ${APP_AUTH_REGISTRATION_IP_LIMIT_PER_HOUR:-5}
  APP_AUTH_EMAIL_VERIFICATION_REQUIRED: ${APP_AUTH_EMAIL_VERIFICATION_REQUIRED:-true}
  APP_AUTH_PUBLIC_URL: ${APP_AUTH_PUBLIC_URL:-}
  APP_AUTH_EMAIL_VERIFICATION_SECONDS: ${APP_AUTH_EMAIL_VERIFICATION_SECONDS:-86400}
  APP_AUTH_PASSWORD_RESET_SECONDS: ${APP_AUTH_PASSWORD_RESET_SECONDS:-3600}
  APP_AUTH_EMAIL_REQUEST_LIMIT_PER_HOUR: ${APP_AUTH_EMAIL_REQUEST_LIMIT_PER_HOUR:-5}
  APP_AUTH_SMTP_HOST: ${APP_AUTH_SMTP_HOST:-}
  APP_AUTH_SMTP_PORT: ${APP_AUTH_SMTP_PORT:-587}
  APP_AUTH_SMTP_USERNAME: ${APP_AUTH_SMTP_USERNAME:-}
  APP_AUTH_SMTP_PASSWORD: ${APP_AUTH_SMTP_PASSWORD:-}
  APP_AUTH_SMTP_STARTTLS: ${APP_AUTH_SMTP_STARTTLS:-true}
  APP_AUTH_SMTP_SSL: ${APP_AUTH_SMTP_SSL:-false}
  APP_AUTH_SMTP_FROM_EMAIL: ${APP_AUTH_SMTP_FROM_EMAIL:-}
  APP_AUTH_SMTP_TIMEOUT_SECONDS: ${APP_AUTH_SMTP_TIMEOUT_SECONDS:-10}
  REDIS_HOST: redis
