  APP_AI_CONFIG_ENCRYPTION_KEY_FILE: /var/lib/interview-guide/provider-encryption.key
  APP_PROVIDER_OUTBOUND_ALLOWED_HOSTS: ${APP_PROVIDER_OUTBOUND_ALLOWED_HOSTS:-}
