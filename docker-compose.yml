x-backend-build: &backend-build
  context: .
  dockerfile: backend/Dockerfile

x-backend-environment: &backend-environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-interview_guide}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
  APP_DATABASE_POOL_SIZE: ${APP_DATABASE_POOL_SIZE:-10}
  APP_DATABASE_MAX_OVERFLOW: ${APP_DATABASE_MAX_OVERFLOW:-0}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  APP_STORAGE_ENDPOINT: http://minio:9000
  APP_STORAGE_ACCESS_KEY: ${APP_STORAGE_ACCESS_KEY:-minioadmin}
  APP_STORAGE_SECRET_KEY: ${APP_STORAGE_SECRET_KEY:-minioadmin}
  APP_STORAGE_BUCKET: ${APP_STORAGE_BUCKET:-interview-guide}
  APP_STORAGE_REGION: ${APP_STORAGE_REGION:-us-east-1}
  APP_STORAGE_AUTO_CREATE_BUCKET: "false"
  APP_AI_CONFIG_ENCRYPTION_KEY: ${APP_AI_CONFIG_ENCRYPTION_KEY:?APP_AI_CONFIG_ENCRYPTION_KEY is required}
  AI_BAILIAN_API_KEY: ${AI_BAILIAN_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-qwen3.7-max}
  AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-qwen3.7-text-embedding}
  PROVIDER_LMSTUDIO_API_KEY: ${PROVIDER_LMSTUDIO_API_KEY:-lm-studio}
  PROVIDER_KIMI_API_KEY: ${PROVIDER_KIMI_API_KEY:-}
  PROVIDER_KIMI_MODEL: ${PROVIDER_KIMI_MODEL:-kimi-k2.6}
  PROVIDER_DEEPSEEK_API_KEY: ${PROVIDER_DEEPSEEK_API_KEY:-}
  PROVIDER_DEEPSEEK_MODEL: ${PROVIDER_DEEPSEEK_MODEL:-deepseek-v4-flash}
  PROVIDER_GLM_API_KEY: ${PROVIDER_GLM_API_KEY:-}
  PROVIDER_GLM_MODEL: ${PROVIDER_GLM_MODEL:-glm-5}
  APP_AI_RAG_REWRITE_ENABLED: ${APP_AI_RAG_REWRITE_ENABLED:-true}
  APP_AI_RAG_SHORT_QUERY_LENGTH: ${APP_AI_RAG_SHORT_QUERY_LENGTH:-4}
  APP_AI_RAG_TOPK_SHORT: ${APP_AI_RAG_TOPK_SHORT:-20}
  APP_AI_RAG_TOPK_MEDIUM: ${APP_AI_RAG_TOPK_MEDIUM:-12}
  APP_AI_RAG_TOPK_LONG: ${APP_AI_RAG_TOPK_LONG:-8}
  APP_AI_RAG_MIN_SCORE_SHORT: ${APP_AI_RAG_MIN_SCORE_SHORT:-0.18}
  APP_AI_RAG_MIN_SCORE_DEFAULT: ${APP_AI_RAG_MIN_SCORE_DEFAULT:-0.28}
  APP_AI_RAG_HISTORY_ENABLED: ${APP_AI_RAG_HISTORY_ENABLED:-true}
  APP_AI_RAG_HISTORY_MAX_MESSAGES: ${APP_AI_RAG_HISTORY_MAX_MESSAGES:-10}
  APP_INTERVIEW_FOLLOW_UP_COUNT: ${APP_INTERVIEW_FOLLOW_UP_COUNT:-1}
  APP_INTERVIEW_TURN_CONFIDENCE_THRESHOLD: ${APP_INTERVIEW_TURN_CONFIDENCE_THRESHOLD:-0.65}
  APP_INTERVIEW_TURN_DECISION_TIMEOUT_SECONDS: ${APP_INTERVIEW_TURN_DECISION_TIMEOUT_SECONDS:-20}
  APP_INTERVIEW_TURN_LEASE_SECONDS: ${APP_INTERVIEW_TURN_LEASE_SECONDS:-30}
  APP_INTERVIEW_TURN_CONTEXT_MAX_CHARS: ${APP_INTERVIEW_TURN_CONTEXT_MAX_CHARS:-12000}
  APP_INTERVIEW_TURN_RECENT_COUNT: ${APP_INTERVIEW_TURN_RECENT_COUNT:-6}
  APP_VOICE_TURN_MIN_REMAINING_SECONDS: ${APP_VOICE_TURN_MIN_REMAINING_SECONDS:-30}
  ALLOW_DESTRUCTIVE_INTERVIEW_RESET: ${ALLOW_DESTRUCTIVE_INTERVIEW_RESET:-0}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  TZ: ${TZ:-Asia/Shanghai}

x-backend-service: &backend-service
  image: interview-guide-python:${INTERVIEW_GUIDE_IMAGE_TAG:-local}
  build: *backend-build
  environment: *backend-environment
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16@sha256:16e62164a405447dca191079a924ee5b8a9dbf04fe53128701ffbea857b37782
    platform: linux/amd64
    container_name: interview-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-interview_guide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-interview_guide}
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine@sha256:519f0189dfdee3bc0bad61fb265fe73d864b5c64020e6579ad48a45c49965635
    platform: linux/amd64
    container_name: interview-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z@sha256:34c8e2f52a5984492555427fee07254c80036bdb7079bb91679232abd7a4fa20
    platform: linux/amd64
    container_name: interview-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_PASSWORD: ${APP_STORAGE_SECRET_KEY:-minioadmin}
      MINIO_ROOT_USER: ${APP_STORAGE_ACCESS_KEY:-minioadmin}
    ports:
      - "${APP_STORAGE_PORT:-9000}:9000"
      - "${APP_STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  createbuckets:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z@sha256:771f5ad7925a6b5e069786d8e847a292de320f1e3e3203647e29f47ec9b3d93b
    platform: linux/amd64
    depends_on:
      minio:
        condition: service_healthy
    environment:
      BUCKET: ${APP_STORAGE_BUCKET:-interview-guide}
      MINIO_ROOT_PASSWORD: ${APP_STORAGE_SECRET_KEY:-minioadmin}
      MINIO_ROOT_USER: ${APP_STORAGE_ACCESS_KEY:-minioadmin}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set storage http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "storage/$${BUCKET}"
        mc anonymous set public "storage/$${BUCKET}"

  migrate:
    <<: *backend-service
    container_name: interview-migrate
    command: ["interview-guide-migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    <<: *backend-service
    container_name: interview-app
    command: ["interview-guide-api"]
    depends_on:
      createbuckets:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
            'http://127.0.0.1:8080/actuator/health',
            timeout=3
          ).read()
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  worker:
    <<: *backend-service
    container_name: interview-worker
    command: ["interview-guide-worker"]
    depends_on:
      createbuckets:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  scheduler:
    <<: *backend-service
    container_name: interview-scheduler
    command: ["interview-guide-scheduler"]
    depends_on:
      createbuckets:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: interview-guide-frontend:${INTERVIEW_GUIDE_IMAGE_TAG:-local}
    container_name: interview-frontend
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped

volumes:
  minio_data:
  postgres_data:
  redis_data:
