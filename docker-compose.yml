  APP_OPENTREK_AGENT_LOCK_FILE: ${APP_OPENTREK_AGENT_LOCK_FILE:-}
  APP_OPENTREK_AGENT_MIN_INTERVAL_SECONDS: ${APP_OPENTREK_AGENT_MIN_INTERVAL_SECONDS:-0}
  APP_AI_RAG_REWRITE_ENABLED: ${APP_AI_RAG_REWRITE_ENABLED:-true}
  APP_AI_RAG_SHORT_QUERY_LENGTH: ${APP_AI_RAG_SHORT_QUERY_LENGTH:-4}
  APP_AI_RAG_TOPK_SHORT: ${APP_AI_RAG_TOPK_SHORT:-20}
  APP_AI_RAG_TOPK_MEDIUM: ${APP_AI_RAG_TOPK_MEDIUM:-12}
  APP_AI_RAG_TOPK_LONG: ${APP_AI_RAG_TOPK_LONG:-8}
  APP_AI_RAG_MIN_SCORE_SHORT: ${APP_AI_RAG_MIN_SCORE_SHORT:-0.18}
  APP_AI_RAG_MIN_SCORE_DEFAULT: ${APP_AI_RAG_MIN_SCORE_DEFAULT:-0.28}
  APP_AI_RAG_HISTORY_ENABLED: ${APP_AI_RAG_HISTORY_ENABLED:-true}
  APP_AI_RAG_HISTORY_MAX_MESSAGES: ${APP_AI_RAG_HISTORY_MAX_MESSAGES:-10}
  APP_INTERVIEW_FOLLOW_UP_COUNT: ${APP_INTERVIEW_FOLLOW_UP_COUNT:-1}
  APP_INTERVIEW_TURN_CONFIDENCE_THRESHOLD: ${APP_INTERVIEW_TURN_CONFIDENCE_THRESHOLD:-0.65}
  APP_INTERVIEW_TURN_DECISION_TIMEOUT_SECONDS: ${APP_INTERVIEW_TURN_DECISION_TIMEOUT_SECONDS:-20}
  APP_INTERVIEW_TURN_LEASE_SECONDS: ${APP_INTERVIEW_TURN_LEASE_SECONDS:-30}
  APP_INTERVIEW_TURN_CONTEXT_MAX_CHARS: ${APP_INTERVIEW_TURN_CONTEXT_MAX_CHARS:-12000}
  APP_INTERVIEW_TURN_RECENT_COUNT: ${APP_INTERVIEW_TURN_RECENT_COUNT:-6}
  APP_VOICE_TURN_MIN_REMAINING_SECONDS: ${APP_VOICE_TURN_MIN_REMAINING_SECONDS:-30}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  TZ: ${TZ:-Asia/Shanghai}

x-backend-service: &backend-service
  image: interview-guide-python:${INTERVIEW_GUIDE_IMAGE_TAG:-local}
  build: *backend-build
  environment: *backend-environment
  volumes:
    - provider_key:/var/lib/interview-guide
  restart: unless-stopped

services:
  postgres:
    image: ${INTERVIEW_GUIDE_DOCKERHUB_REGISTRY:-docker.io}/pgvector/pgvector:0.8.1-pg16@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-interview_guide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-interview_guide}
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: ${INTERVIEW_GUIDE_DOCKERHUB_REGISTRY:-docker.io}/library/redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    image: ${INTERVIEW_GUIDE_DOCKERHUB_REGISTRY:-docker.io}/minio/minio:RELEASE.2024-12-18T13-15-44Z@sha256:1dce27c494a16bae114774f1cec295493f3613142713130c2d22dd5696be6ad3
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_PASSWORD: ${APP_STORAGE_SECRET_KEY:?set APP_STORAGE_SECRET_KEY in .env}
      MINIO_ROOT_USER: ${APP_STORAGE_ACCESS_KEY:?set APP_STORAGE_ACCESS_KEY in .env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  createbuckets:
    image: ${INTERVIEW_GUIDE_DOCKERHUB_REGISTRY:-docker.io}/minio/mc:RELEASE.2024-11-21T17-21-54Z@sha256:993e8c454a7ec632923f7e3e61adf1d473261da6354cefd641aedd33a2cfe112
    depends_on:
      minio:
        condition: service_healthy
    environment:
      BUCKET: ${APP_STORAGE_BUCKET:-interview-guide}
      MINIO_ROOT_PASSWORD: ${APP_STORAGE_SECRET_KEY:?set APP_STORAGE_SECRET_KEY in .env}
      MINIO_ROOT_USER: ${APP_STORAGE_ACCESS_KEY:?set APP_STORAGE_ACCESS_KEY in .env}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set storage http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "storage/$${BUCKET}"
        mc anonymous set none "storage/$${BUCKET}"

  migrate:
    <<: *backend-service
    command: ["interview-guide-migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    <<: *backend-service
    command: ["interview-guide-api"]
    depends_on:
      createbuckets:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
            'http://127.0.0.1:8080/health',
            timeout=3
          ).read()
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  worker:
    <<: *backend-service
    command: ["interview-guide-worker"]
    depends_on:
      createbuckets:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  scheduler:
    <<: *backend-service
    command: ["interview-guide-scheduler"]
    depends_on:
      createbuckets:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: ${INTERVIEW_GUIDE_BUILD_NETWORK:-default}
      args:
        INTERVIEW_GUIDE_DOCKERHUB_REGISTRY: ${INTERVIEW_GUIDE_DOCKERHUB_REGISTRY:-docker.io}
    image: interview-guide-frontend:${INTERVIEW_GUIDE_IMAGE_TAG:-local}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-5173}:80"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1/health
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  gateway:
    profiles: ["https"]
    image: ${INTERVIEW_GUIDE_DOCKERHUB_REGISTRY:-docker.io}/library/caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.invalid}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    ports:
      - "${TLS_BIND_ADDRESS:-0.0.0.0}:${TLS_HTTP_PORT:-80}:80"
      - "${TLS_BIND_ADDRESS:-0.0.0.0}:${TLS_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_config:/config
      - caddy_data:/data
    networks:
      default:
        aliases:
          - "${PUBLIC_DOMAIN:-localhost}"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s
    restart: unless-stopped

volumes:
  caddy_config:
  caddy_data:
  minio_data:
  postgres_data:
  provider_key:
  redis_data:
