  context: .
  dockerfile: backend/Dockerfile
  network: ${INTERVIEW_GUIDE_BUILD_NETWORK:-default}
  args:
    INTERVIEW_GUIDE_DOCKERHUB_REGISTRY: ${INTERVIEW_GUIDE_DOCKERHUB_REGISTRY:-docker.io}

