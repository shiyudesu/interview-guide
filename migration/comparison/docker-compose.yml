name: interview-guide-comparison

services:
  java-postgres:
    image: pgvector/pgvector:0.8.1-pg16@sha256:16e62164a405447dca191079a924ee5b8a9dbf04fe53128701ffbea857b37782
    platform: linux/amd64
    environment:
      POSTGRES_DB: interview_guide_java
      POSTGRES_PASSWORD: comparison-password
      POSTGRES_USER: postgres
    ports:
      - "15432:5432"
    volumes:
      - java_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interview_guide_java"]
      interval: 2s
      timeout: 3s
      retries: 30

  python-postgres:
    image: pgvector/pgvector:0.8.1-pg16@sha256:16e62164a405447dca191079a924ee5b8a9dbf04fe53128701ffbea857b37782
    platform: linux/amd64
    environment:
      POSTGRES_DB: interview_guide_python
      POSTGRES_PASSWORD: comparison-password
      POSTGRES_USER: postgres
    ports:
      - "25432:5432"
    volumes:
      - python_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interview_guide_python"]
      interval: 2s
      timeout: 3s
      retries: 30

  java-redis:
    image: redis:7.4.2-alpine@sha256:519f0189dfdee3bc0bad61fb265fe73d864b5c64020e6579ad48a45c49965635
    platform: linux/amd64
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    volumes:
      - java_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  python-redis:
    image: redis:7.4.2-alpine@sha256:519f0189dfdee3bc0bad61fb265fe73d864b5c64020e6579ad48a45c49965635
    platform: linux/amd64
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "26379:6379"
    volumes:
      - python_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z@sha256:34c8e2f52a5984492555427fee07254c80036bdb7079bb91679232abd7a4fa20
    platform: linux/amd64
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_PASSWORD: comparison-secret
      MINIO_ROOT_USER: comparison-access
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z@sha256:771f5ad7925a6b5e069786d8e847a292de320f1e3e3203647e29f47ec9b3d93b
    platform: linux/amd64
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set comparison http://minio:9000 comparison-access comparison-secret
        mc mb --ignore-existing comparison/interview-guide-java
        mc mb --ignore-existing comparison/interview-guide-python

volumes:
  java_postgres_data:
  java_redis_data:
  minio_data:
  python_postgres_data:
  python_redis_data:
