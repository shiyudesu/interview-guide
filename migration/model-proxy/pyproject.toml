[project]
name = "interview-guide-model-proxy"
version = "0.1.0"
description = "Transparent HTTP and WebSocket recorder for migration model comparisons"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiohttp==3.14.3",
]

[project.scripts]
interview-guide-model-proxy = "model_proxy.__main__:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_proxy"]
