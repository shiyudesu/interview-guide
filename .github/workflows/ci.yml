name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.classify.outputs.docs }}
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      model_proxy: ${{ steps.classify.outputs.model_proxy }}
      manifests: ${{ steps.classify.outputs.manifests }}
      deployment: ${{ steps.classify.outputs.deployment }}
      production: ${{ steps.classify.outputs.production }}
      full: ${{ steps.classify.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: >-
          python tools/scripts/detect_ci_changes.py
          --event-name "$EVENT_NAME"
          --before "$BEFORE_SHA"
          --sha "$HEAD_SHA"
          --base-ref "$BASE_REF"
          >> "$GITHUB_OUTPUT"

  repository_policy:
    name: Repository policy
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: needs.changes.outputs.manifests == 'true'
        with:
          python-version: "3.13.13"
      - name: Test commit message hook
        run: bash scripts/test-commit-msg-hook.sh
      - name: Test repository tools
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Check documentation
        run: python tools/scripts/check_docs.py --root .
      - name: Check repository manifests
        if: needs.changes.outputs.manifests == 'true'
        run: bash tools/scripts/check-manifests.sh
      - name: Validate production Compose
        if: needs.changes.outputs.deployment == 'true'
        run: docker compose config --quiet

  backend:
    name: Backend checks
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7.4.2-alpine@sha256:519f0189dfdee3bc0bad61fb265fe73d864b5c64020e6579ad48a45c49965635
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.13"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          version: "0.11.14"
      - name: Install locked dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Run lint and type checks
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
      - name: Run tests
        working-directory: backend
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: uv run pytest
      - name: Build application image
        run: docker build --file backend/Dockerfile --tag interview-guide-python:ci .
      - name: Verify Python-only image
        run: >-
          docker run --rm interview-guide-python:ci
          sh -c 'test ! -e /usr/bin/java && ! command -v java'

  frontend:
    name: Frontend tests and build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend tests
        run: |
          pnpm run test:interview-history
          pnpm run test:question-generation
          pnpm run test:interview-capacity
          pnpm run test:interview-entry
      - name: Build frontend
        run: pnpm run build

  model_proxy:
    name: Model proxy checks
    needs: changes
    if: needs.changes.outputs.model_proxy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/model-proxy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.13"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: tools/model-proxy/uv.lock
          version: "0.11.14"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Test HTTP and WebSocket proxy
        run: uv run python -m unittest discover -s tests -v

  production_integration:
    name: Production Compose integration
    needs:
      - changes
      - repository_policy
      - backend
      - frontend
    if: >-
      ${{
        always() &&
        needs.changes.result == 'success' &&
        needs.repository_policy.result == 'success' &&
        needs.changes.outputs.production == 'true' &&
        (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
        (needs.frontend.result == 'success' || needs.frontend.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1:4173
      INTEGRATION_DATABASE: interview_guide_integration
      TEST_S3_BUCKET: interview-guide-integration-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.13"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          version: "0.11.14"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - name: Install dependencies
        run: |
          cd backend && uv sync --frozen
          cd ../frontend && pnpm install --frozen-lockfile
          pnpm exec playwright install-deps chromium
          pnpm exec playwright install chromium
      - name: Start production Compose
        run: docker compose up -d --build --wait
      - name: Prepare isolated integration database
        run: |
          docker compose exec -T postgres \
            createdb -U postgres "$INTEGRATION_DATABASE"
          cd backend
          POSTGRES_HOST=127.0.0.1 \
          POSTGRES_PORT=5432 \
          POSTGRES_DB="$INTEGRATION_DATABASE" \
          POSTGRES_USER=postgres \
          POSTGRES_PASSWORD=password \
          uv run --frozen interview-guide-migrate
      - name: Run infrastructure integration tests
        working-directory: backend
        env:
          PGPASSWORD: password
          TEST_POSTGRES_URL: postgresql+psycopg://postgres@127.0.0.1:5432/interview_guide_integration
          TEST_REDIS_URL: redis://127.0.0.1:6379/15
          TEST_S3_ACCESS_KEY: minioadmin
          TEST_S3_ENDPOINT: http://127.0.0.1:9000
          TEST_S3_SECRET_KEY: minioadmin
        run: uv run pytest -m integration
      - name: Run frontend against production backend
        working-directory: frontend
        env:
          REAL_BACKEND_URL: http://127.0.0.1:8080
          RUN_REAL_BACKEND_E2E: "true"
        run: pnpm run test:e2e --grep @real-backend
      - name: Verify frontend proxy after API recreation
        run: |
          docker compose up -d --force-recreate --no-deps --wait app
          curl --fail --retry 10 --retry-delay 1 http://127.0.0.1/health
          test "$(docker inspect -f '{{.State.Health.Status}}' interview-frontend)" = healthy
      - name: Capture Compose logs
        if: failure()
        run: |
          mkdir -p .artifacts
          docker compose ps -a > .artifacts/production-compose-ps.txt
          docker compose logs --no-color > .artifacts/production-compose.log
      - name: Upload integration logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: production-compose-integration
          path: .artifacts/production-compose*
          if-no-files-found: ignore
      - name: Stop production Compose
        if: always()
        run: docker compose down -v --remove-orphans

  ci_gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - repository_policy
      - backend
      - frontend
      - model_proxy
      - production_integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          BACKEND_REQUIRED: ${{ needs.changes.outputs.backend }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_REQUIRED: ${{ needs.changes.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          MODEL_PROXY_REQUIRED: ${{ needs.changes.outputs.model_proxy }}
          MODEL_PROXY_RESULT: ${{ needs.model_proxy.result }}
          PRODUCTION_REQUIRED: ${{ needs.changes.outputs.production }}
          PRODUCTION_RESULT: ${{ needs.production_integration.result }}
          REPOSITORY_POLICY_RESULT: ${{ needs.repository_policy.result }}
        run: |
          require_success() {
            name="$1"
            result="$2"
            if [ "$result" != "success" ]; then
              echo "$name did not succeed: $result"
              exit 1
            fi
          }

          require_if_selected() {
            name="$1"
            required="$2"
            result="$3"
            if [ "$required" = "true" ]; then
              require_success "$name" "$result"
            elif [ "$result" != "skipped" ] && [ "$result" != "success" ]; then
              echo "$name returned unexpected result: $result"
              exit 1
            fi
          }

          require_success "Detect changes" "$CHANGES_RESULT"
          require_success "Repository policy" "$REPOSITORY_POLICY_RESULT"
          require_if_selected "Backend checks" "$BACKEND_REQUIRED" "$BACKEND_RESULT"
          require_if_selected "Frontend tests and build" "$FRONTEND_REQUIRED" "$FRONTEND_RESULT"
          require_if_selected "Model proxy checks" "$MODEL_PROXY_REQUIRED" "$MODEL_PROXY_RESULT"
          require_if_selected \
            "Production Compose integration" \
            "$PRODUCTION_REQUIRED" \
            "$PRODUCTION_RESULT"
