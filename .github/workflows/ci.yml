name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Test commit message hook
        run: bash scripts/test-commit-msg-hook.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.13"
      - name: Check repository manifests
        run: bash tools/scripts/check-manifests.sh
      - name: Validate production Compose
        env:
          APP_AI_CONFIG_ENCRYPTION_KEY: ci-compose-encryption-key
        run: docker compose config --quiet

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7.4.2-alpine@sha256:519f0189dfdee3bc0bad61fb265fe73d864b5c64020e6579ad48a45c49965635
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.13"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          version: "0.11.14"
      - name: Install locked dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Run lint and type checks
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
      - name: Run tests
        working-directory: backend
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: uv run pytest
      - name: Build application image
        run: docker build --file backend/Dockerfile --tag interview-guide-python:ci .
      - name: Verify image contains no JVM
        run: >-
          docker run --rm interview-guide-python:ci
          sh -c 'test ! -e /usr/bin/java && ! command -v java'

  production-integration:
    name: Production Compose integration
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AI_BAILIAN_API_KEY: ci-placeholder
      APP_AI_CONFIG_ENCRYPTION_KEY: ci-compose-encryption-key
      CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.13"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          version: "0.11.14"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: |
          cd backend && uv sync --frozen
          cd ../frontend && pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Start production Compose
        run: docker compose up -d --build --wait
      - name: Pause background processes for controlled integration tests
        run: docker compose stop worker scheduler
      - name: Run infrastructure integration tests
        working-directory: backend
        env:
          PGPASSWORD: password
          TEST_POSTGRES_URL: postgresql+psycopg://postgres@127.0.0.1:5432/interview_guide
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
          TEST_S3_ACCESS_KEY: minioadmin
          TEST_S3_BUCKET: interview-guide-integration
          TEST_S3_ENDPOINT: http://127.0.0.1:9000
          TEST_S3_SECRET_KEY: minioadmin
        run: uv run pytest -m integration
      - name: Restore backend after destructive integration fixtures
        run: |
          docker compose exec -T postgres psql \
            -U postgres -d interview_guide \
            -c 'TRUNCATE TABLE llm_global_setting, llm_provider_config'
          docker compose up -d --force-recreate app worker scheduler --wait
      - name: Run frontend against production backend
        working-directory: frontend
        env:
          REAL_BACKEND_URL: http://127.0.0.1:8080
          RUN_REAL_BACKEND_E2E: "true"
        run: pnpm run test:e2e --grep @real-backend
      - name: Capture Compose logs
        if: always()
        run: |
          mkdir -p .artifacts
          docker compose ps -a > .artifacts/production-compose-ps.txt
          docker compose logs --no-color > .artifacts/production-compose.log
      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-compose-integration
          path: .artifacts/production-compose*
          if-no-files-found: ignore
      - name: Stop production Compose
        if: always()
        run: docker compose down -v --remove-orphans

  model-proxy:
    name: Model proxy checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/model-proxy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.13"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: tools/model-proxy/uv.lock
          version: "0.11.14"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Test HTTP and WebSocket proxy
        run: uv run python -m unittest discover -s tests -v

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend tests
        run: |
          pnpm run test:interview-history
          pnpm run test:question-generation
          pnpm run test:interview-capacity
          pnpm run test:interview-entry
      - name: Build frontend
        run: pnpm run build
