name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test commit message hook
        run: bash scripts/test-commit-msg-hook.sh

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.13"

      - name: Check migration manifests
        run: bash migration/scripts/check-manifests.sh

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect backend implementations
        id: backend
        shell: bash
        run: |
          if [[ -f app/build.gradle ]]; then
            echo "java=true" >> "$GITHUB_OUTPUT"
          else
            echo "java=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -f backend/pyproject.toml ]]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ ! -f app/build.gradle && ! -f backend/pyproject.toml ]]; then
            echo "No supported backend implementation was found." >&2
            exit 1
          fi

      - name: Set up Java 25
        if: steps.backend.outputs.java == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Run Java baseline tests
        if: steps.backend.outputs.java == 'true'
        run: ./gradlew :app:test --no-daemon

      - name: Set up Python 3.13
        if: steps.backend.outputs.python == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.13"

      - name: Set up uv
        if: steps.backend.outputs.python == 'true'
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          version: "0.11.14"

      - name: Install Python dependencies
        if: steps.backend.outputs.python == 'true'
        working-directory: backend
        run: uv sync --frozen

      - name: Run Python lint and type checks
        if: steps.backend.outputs.python == 'true'
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src

      - name: Run Python tests
        if: steps.backend.outputs.python == 'true'
        working-directory: backend
        run: uv run pytest

      - name: Build Python application image
        if: steps.backend.outputs.python == 'true'
        run: docker build --file backend/Dockerfile --tag interview-guide-python:ci .

      - name: Verify Python image contains no JVM
        if: steps.backend.outputs.python == 'true'
        run: |
          docker run --rm interview-guide-python:ci \
            sh -c 'test ! -e /usr/bin/java && ! command -v java'

  migration-comparison:
    name: Migration comparison
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: migration/model-proxy/uv.lock
          version: "0.11.14"

      - name: Start isolated comparison environment
        run: ./migration/scripts/start-comparison-env.sh

      - name: Run Java baseline and candidate comparison
        run: ./migration/scripts/run-comparison.sh

      - name: Upload comparison reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: migration-comparison-reports
          path: migration/reports/
          if-no-files-found: ignore

      - name: Stop isolated comparison environment
        if: always()
        run: ./migration/scripts/stop-comparison-env.sh

  model-proxy:
    name: Model proxy checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: migration/model-proxy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: migration/model-proxy/uv.lock
          version: "0.11.14"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Test HTTP and WebSocket proxy
        run: |
          uv run python -m compileall -q src tests
          uv run python -m unittest discover -s tests -v

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: |
          pnpm run test:interview-history
          pnpm run test:question-generation
          pnpm run test:interview-capacity
          pnpm run test:interview-entry

      - name: Build frontend
        run: pnpm run build
