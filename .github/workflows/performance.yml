name: Migration performance checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-performance
  cancel-in-progress: false

jobs:
  rest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.13"

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            migration/model-proxy/uv.lock

      - name: Start isolated Java and Python
        env:
          COMPARISON_CANDIDATE: python
        run: ./migration/scripts/start-comparison-env.sh

      - name: Compare REST latency, throughput, errors, and memory
        run: ./migration/scripts/run-rest-performance-comparison.sh

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: migration-performance-report
          path: migration/reports/rest-performance-comparison.json
          if-no-files-found: ignore

      - name: Stop comparison environment
        if: always()
        run: ./migration/scripts/stop-comparison-env.sh
