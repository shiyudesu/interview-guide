[project]
name = "interview-guide-backend"
version = "0.1.0"
description = "FastAPI backend for InterviewGuide"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.19.1",
    "apscheduler==3.11.3",
    "boto3==1.43.72",
    "cryptography==50.0.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "langchain-openai==1.5.1",
    "langgraph==1.2.11",
    "opentelemetry-api==1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.44.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-sdk==1.44.0",
    "pgvector==0.5.0",
    "pdfminer-six==20260107",
    "prometheus-client==0.26.0",
    "psycopg[binary,pool]==3.3.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "pypdf==6.16.1",
    "pypinyin==0.55.0",
    "python-docx==1.2.0",
    "python-magic==0.4.27",
    "python-multipart==0.0.32",
    "pyyaml==6.0.3",
    "redis==8.1.0",
    "reportlab==5.0.0",
    "sqlalchemy==2.0.52",
    "uvicorn[standard]==0.52.3",
    "websockets==15.0.1",
    "tiktoken==0.12.0",
]

[project.scripts]
interview-guide-api = "interview_guide.main:run"
interview-guide-migrate = "interview_guide.migrate:main"
interview-guide-scheduler = "interview_guide.scheduler:main"
interview-guide-worker = "interview_guide.worker:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "boto3-stubs[s3]==1.43.72",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-mock==3.15.1",
    "ruff==0.16.3",
    "types-reportlab==4.5.1.20260807",
    "types-pyyaml==6.0.12.20260815",
]

[tool.hatch.build.targets.wheel]
packages = ["src/interview_guide"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires real PostgreSQL, Redis, or S3 infrastructure",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
"src/interview_guide/common/ai/prompts.py" = ["E501"]
"tests/**/*.py" = ["S101"]
